apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: crop-backend:latest
        imagePullPolicy: Never  # Uses local docker image for testing
        ports:
        - containerPort: 8000